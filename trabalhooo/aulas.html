<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Definição De Borda</title>
</head>
<style>
    p{ width: 25%; }  
   .groove
   {border-style: groove; 
    margin: auto; 
    border-width: 20px;}
   .solid 
   { border-style: solid; }
   .dashed 
   { border-style: dashed; }
   .dotted
   { border-style: dotted; }
   .double
   { border-style: double ; }
   .quatro-bordas
   { border-style: solid dashed dotted double; }
   .duas-bordas
   { border-style: double none double none;}
   .azul 
   { border-style: solid; border-width: 10px; border-color: blue; }
   .roxo 
   { border-style: solid; border-width: 10px; border-color: #b525e8; }
   .vermelho-5 
   { border-style: solid; border-radius: 5px; border-color: red; }
   .vermelho-15 
   { border-style: solid; border-radius: 15px; border-color: red; }
   .vermelho-padding
   { border-style: solid; border-radius: 15px; padding: 20px; border-color: red; }
</style>
</body>
   <p class="groove">aplicação de borda</p> 
   <p class="solid">aplicação de borda</p> 
   <p class="dashed">aplicação de borda</p> 
   <p class="dotted">aplicação de borda</p> 
   <p class="double">aplicação de borda</p> 
   <p class="quatro-bordas">aplicação de borda</p> 
   <p class="duas-bordas">aplicação de borda</p> 
   <p class="azul">aplicação de borda</p> 
   <p class="roxo">aplicação de borda</p> 
   <p class="vermelho-5">aplicação de borda</p> 
   <p class="vermelho-15">aplicação de borda</p> 
   <p class="vermelho-padding">aplicação de borda</p>
</body>
</html>
